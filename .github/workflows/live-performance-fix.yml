name: Apply live performance fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-performance-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated theme changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # Homepage: eliminate the decorative initial reveal from the LCP path.
          p = root / 'templates/index.json'
          s = p.read_text()
          old = '"show_initial_transition": true'
          if old not in s:
              raise SystemExit('Expected slideshow transition setting not found')
          p.write_text(s.replace(old, '"show_initial_transition": false', 1))

          # Slideshow: semantic heading order and no eyebrow heading level.
          p = root / 'sections/slideshow.liquid'
          s = p.read_text()
          old = '''            {%- if block.settings.subheading != blank -%}\n              <h2 class="heading heading--small unpatched-eyebrow">\n                <split-lines {% if section.settings.transition_type != 'fade' %}{% if section.settings.show_initial_transition or forloop.first == false %}reveal{% endif %}{% endif %}>{{ block.settings.subheading | escape }}</split-lines>\n              </h2>\n            {%- endif -%}\n\n            {%- if block.settings.title != blank -%}\n              <h3 class="heading heading--large">\n                <split-lines {% if section.settings.transition_type != 'fade' %}{% if section.settings.show_initial_transition or forloop.first == false %}reveal{% endif %}{% endif %}>{{ block.settings.title | escape }}</split-lines>\n              </h3>\n            {%- endif -%}'''
          new = '''            {%- if block.settings.subheading != blank -%}\n              <p class="heading heading--small unpatched-eyebrow">\n                <split-lines {% if section.settings.transition_type != 'fade' %}{% if section.settings.show_initial_transition or forloop.first == false %}reveal{% endif %}{% endif %}>{{ block.settings.subheading | escape }}</split-lines>\n              </p>\n            {%- endif -%}\n\n            {%- if block.settings.title != blank -%}\n              {%- if forloop.first -%}\n                <h1 class="heading heading--large">\n                  <split-lines {% if section.settings.transition_type != 'fade' %}{% if section.settings.show_initial_transition %}reveal{% endif %}{% endif %}>{{ block.settings.title | escape }}</split-lines>\n                </h1>\n              {%- else -%}\n                <h2 class="heading heading--large">\n                  <split-lines {% if section.settings.transition_type != 'fade' %}reveal{% endif %}>{{ block.settings.title | escape }}</split-lines>\n                </h2>\n              {%- endif -%}\n            {%- endif -%}'''
          if old not in s:
              raise SystemExit('Expected slideshow heading block not found')
          p.write_text(s.replace(old, new, 1))

          # Mobile drawer: accessible home link; move closed-drawer-only CSS out of critical HTML.
          p = root / 'snippets/mobile-menu.liquid'
          s = p.read_text()
          start = s.find('<style>')
          end = s.find('</style>', start)
          if start < 0 or end < 0:
              raise SystemExit('Expected mobile drawer inline style not found')
          style_css = s[start + len('<style>'):end].strip('\n')
          s = s[:start] + s[end + len('</style>'):]
          old = '''    <a href="{{ routes.root_url }}" class="unpatched-mobile-menu-logo">\n      {%- if section.settings.logo != blank -%}\n        {%- assign logo_size = section.settings.logo_max_width | at_least: section.settings.mobile_logo_max_width | times: 2 -%}\n        <img src="{{ section.settings.logo | image_url: width: logo_size }}" alt="{{ section.settings.logo.alt | escape }}" width="{{ section.settings.logo.width }}" height="{{ section.settings.logo.height }}">'''
          new = '''    <a href="{{ routes.root_url }}" class="unpatched-mobile-menu-logo" aria-label="{{ shop.name | escape }} home">\n      {%- if section.settings.logo != blank -%}\n        {%- assign logo_size = section.settings.logo_max_width | at_least: section.settings.mobile_logo_max_width | times: 2 -%}\n        <img src="{{ section.settings.logo | image_url: width: logo_size }}" alt="{{ section.settings.logo.alt | default: shop.name | escape }}" width="{{ section.settings.logo.width }}" height="{{ section.settings.logo.height }}">'''
          if old not in s:
              raise SystemExit('Expected mobile logo markup not found')
          p.write_text(s.replace(old, new, 1))

          # Deferred chrome owns drawer styling and accessible branded footer colors.
          p = root / 'assets/unpatched-chrome.css'
          chrome = p.read_text()
          marker = '/* Drawer detail rules moved from inline markup to deferred chrome CSS. */'
          if marker in chrome:
              raise SystemExit('Drawer CSS marker already exists')
          chrome += '\n\n' + marker + '\n' + style_css + '\n'
          chrome = chrome.replace('footer .footer__statiq-stat {\n  color: rgb(var(--error-color));\n}', 'footer .footer__statiq-stat {\n  color: #ff6b6b;\n}')
          chrome = chrome.replace('footer .footer__statiq-sign {\n  color: rgb(var(--unpatched-brand-blue-rgb));\n}', 'footer .footer__statiq-sign {\n  color: #7590ff;\n}')
          p.write_text(chrome)

          # Parse primary content before non-primary drawers/cart markup.
          p = root / 'layout/theme.liquid'
          s = p.read_text()
          old = '''    {%- if request.page_type != 'gift_card' and request.page_type != 'password' -%}\n      {%- sections 'header-group' -%}\n      {%- sections 'overlay-group' -%}\n      {%- unless settings.cart_type == 'page' or request.page_type == 'cart' -%}{%- section 'mini-cart' -%}{%- endunless -%}\n    {%- endif -%}\n'''
          new = '''    {%- if request.page_type != 'gift_card' and request.page_type != 'password' -%}\n      {%- sections 'header-group' -%}\n    {%- endif -%}\n'''
          if old not in s:
              raise SystemExit('Expected pre-main drawer block not found')
          s = s.replace(old, new, 1)
          old = '''    {%- if request.page_type != 'gift_card' and request.page_type != 'password' -%}\n      {%- sections 'footer-group' -%}\n    {%- endif -%}\n  </body>'''
          new = '''    {%- if request.page_type != 'gift_card' and request.page_type != 'password' -%}\n      {%- sections 'footer-group' -%}\n      {%- sections 'overlay-group' -%}\n      {%- unless settings.cart_type == 'page' or request.page_type == 'cart' -%}{%- section 'mini-cart' -%}{%- endunless -%}\n    {%- endif -%}\n  </body>'''
          if old not in s:
              raise SystemExit('Expected footer block not found')
          p.write_text(s.replace(old, new, 1))

          # Cheap structural guards before the commit.
          assert '"show_initial_transition": false' in (root / 'templates/index.json').read_text()
          assert 'aria-label="{{ shop.name | escape }} home"' in (root / 'snippets/mobile-menu.liquid').read_text()
          assert '<style>' not in (root / 'snippets/mobile-menu.liquid').read_text().split('<mobile-navigation', 1)[0]
          for css in (root / 'assets').glob('unpatched-*.css'):
              text = css.read_text()
              if text.count('{') != text.count('}'):
                  raise SystemExit(f'CSS brace mismatch: {css}')
          PY

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/live-performance-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "Statiq Design"
          git config user.email "hello@statiqdesign.com"
          git add -A
          git diff --cached --check
          git commit -m "Improve homepage LCP and accessibility"
          git push origin HEAD:main
