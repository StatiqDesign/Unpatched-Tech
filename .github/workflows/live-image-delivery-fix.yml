name: Apply image delivery fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-image-delivery-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated responsive-image changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          root = Path('.')

          p = root / 'sections/unpatched-flagship-pc.liquid'
          s = p.read_text()
          old = '''        {%- if flagship_image != blank -%}\n          {{ flagship_image | image_url: width: 1400, format: 'webp' | image_tag: loading: 'lazy', decoding: 'async', fetchpriority: 'low', widths: '480,640,800,960,1120,1400', sizes: '(max-width: 749px) calc(100vw - 40px), 58vw', class: 'unpatched-home-flagship__image' }}\n        {%- else -%}'''
          new = '''        {%- if flagship_image != blank -%}\n          <picture>\n            <source\n              media="(max-width: 749px)"\n              sizes="min(56vw, 320px)"\n              srcset="{{ flagship_image | image_url: width: 320, format: 'webp' }} 320w, {{ flagship_image | image_url: width: 400, format: 'webp' }} 400w, {{ flagship_image | image_url: width: 480, format: 'webp' }} 480w"\n            >\n            {{ flagship_image | image_url: width: 1400, format: 'webp' | image_tag: loading: 'lazy', decoding: 'async', fetchpriority: 'low', widths: '480,640,800,960,1120,1400', sizes: '58vw', class: 'unpatched-home-flagship__image' }}\n          </picture>\n        {%- else -%}'''
          if old not in s:
              raise SystemExit('Expected flagship image block not found')
          p.write_text(s.replace(old, new, 1))

          p = root / 'sections/unpatched-category-showcase.liquid'
          s = p.read_text()
          old = '''              {%- if card_image != blank -%}\n                {{ card_image | image_url: width: 800, format: 'webp' | image_tag: loading: 'lazy', decoding: 'async', fetchpriority: 'low', widths: '280,320,360,400,480,560,640,800', sizes: '(max-width: 749px) min(82vw, 330px), (max-width: 999px) 44vw, 24vw', class: 'unpatched-home-category-card__image' }}\n              {%- elsif stock_image_url != blank -%}'''
          new = '''              {%- if card_image != blank -%}\n                <picture>\n                  <source\n                    media="(max-width: 749px)"\n                    sizes="min(82vw, 330px)"\n                    srcset="{{ card_image | image_url: width: 320, height: 320, crop: 'center', format: 'webp' }} 320w, {{ card_image | image_url: width: 400, height: 400, crop: 'center', format: 'webp' }} 400w, {{ card_image | image_url: width: 480, height: 480, crop: 'center', format: 'webp' }} 480w, {{ card_image | image_url: width: 560, height: 560, crop: 'center', format: 'webp' }} 560w"\n                  >\n                  {{ card_image | image_url: width: 800, format: 'webp' | image_tag: loading: 'lazy', decoding: 'async', fetchpriority: 'low', widths: '320,400,480,560,640,800', sizes: '(max-width: 999px) 44vw, 24vw', class: 'unpatched-home-category-card__image' }}\n                </picture>\n              {%- elsif stock_image_url != blank -%}'''
          if old not in s:
              raise SystemExit('Expected category image block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/live-image-delivery-fix.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "Statiq Design"
          git config user.email "hello@statiqdesign.com"
          git add -A
          git diff --cached --check
          git commit -m "Optimize mobile homepage image delivery"
          git push origin HEAD:main
