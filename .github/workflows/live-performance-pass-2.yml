name: Finish validated live performance pass
# Manual retrigger after PageSpeed review on 2026-09-11.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-performance-pass-2.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Replace account web components with native login links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('sections/header.liquid')
          s = p.read_text()

          old = '''            {%- else -%}\n              <shopify-account menu="{{ section.settings.customer_account_menu }}"{% if section.settings.show_icons %} class="shopify-account--icons"{% endif %}>\n                <div slot="signed-out-avatar">\n                  <span class="header__icon-wrapper tap-area hidden-phone {% unless section.settings.show_icons %}hidden-desk{% endunless %}">\n                    {%- render 'icon' with 'header-customer' -%}\n                  </span>\n                </div>\n              </shopify-account>\n            {%- endif -%}'''
          new = '''            {%- else -%}\n              <a href="{{ routes.account_login_url }}" class="header__icon-wrapper header__account-link tap-area hidden-phone {% unless section.settings.show_icons %}hidden-desk{% endunless %}" aria-label="{{ 'header.general.login' | t | escape }}">\n                {%- render 'icon' with 'header-customer' -%}\n              </a>\n            {%- endif -%}'''
          if old in s:
              s = s.replace(old, new, 1)

          old = '''                {%- else -%}\n                  <shopify-account menu="{{ section.settings.customer_account_menu }}">\n                    <div slot="signed-out-avatar">\n                      <span>{{ 'header.general.login' | t }}</span>\n                    </div>\n                  </shopify-account>\n                {%- endif -%}'''
          new = '''                {%- else -%}\n                  <a href="{{ routes.account_login_url }}">{{ 'header.general.login' | t }}</a>\n                {%- endif -%}'''
          if old in s:
              s = s.replace(old, new, 1)

          if '<shopify-account' in s:
              raise SystemExit('shopify-account still present after patch')
          if s.count('routes.account_login_url') < 2:
              raise SystemExit('native account login links missing')
          p.write_text(s)
          PY

      - name: Verify validated live performance state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          theme = Path('layout/theme.liquid').read_text()
          assert 'defer fetchpriority="low"' not in theme
          assert theme.count("'theme.js' | asset_url") == 1
          header = Path('sections/header.liquid').read_text()
          assert '<shopify-account' not in header
          assert header.count('routes.account_login_url') >= 2
          pathways = Path('sections/unpatched-pathways.liquid').read_text()
          assert "image_url: width: 1000, format: 'webp'" in pathways
          assert "asset_img_url: '720x' }} 720w" in pathways
          flagship = Path('sections/unpatched-flagship-pc.liquid').read_text()
          assert "image_url: width: 440, format: 'webp' }} 440w" in flagship
          PY

      - name: Theme Check
        uses: shopify/theme-check-action@v2

      - name: Commit final validated state to main
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/live-performance-pass-2.yml
          git config user.name "Statiq Design"
          git config user.email "hello@statiqdesign.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Finish validated storefront performance pass"
          git push origin HEAD:main
